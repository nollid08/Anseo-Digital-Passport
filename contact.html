<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Anseo Digital Passport</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Default.css -->
    <link rel="stylesheet" type="text/css" href="Styles/default.css" />
    <!-- Navbar.css -->
    <link rel="stylesheet" type="text/css" href="Styles/navbar.css" />
    <!-- Contact.css -->
    <link rel="stylesheet" href="Styles/contact.css">

	<link rel="shortcut icon" href="Images/Logo/Favicon/favicon.ico" />
</head>

<body>
    <!-- Start of box-->
    <div class="box">
        <!-- Start of navbar and box header-->
        <nav class="topnav rowx header" id="myTopnav">
            <!-- Start of leftnav -->
            <div class="leftNav">
                <img id="logo" class="logo" src="Images/Logo/anseoDigitalPassportLogo.svg" alt="Logo">
            </div>
            <!-- End of leftnav -->

            <!-- Start of rightnav -->
            <div class="rightNav">
                <a href="logIt.html">Log A Point</a>
				<a href="passport.html">Passport</a>
				<a href="profile.html">Profile</a>
				<a href="locations.html">All Locations</a>
				<a href="about.html">About</a>
				<a href="contact.html">Contact</a>
                <a href="javascript:void(0);" id="icon" class="icon" onclick="openNav()">
                    <i class="fa fa-bars hamburger fa-4x" style="font-size:7vh"></i>
                </a>
            </div>
            <!-- End of rightnav -->
        </nav>
        <!-- End of navbar and box header-->

        <!-- Start of sidebar -->
        <div id="mySidenav" class="sidenav">
            <!-- Start of right-aligned X container -->
            <div class="mobileRightNav">
                <a class="closebtn" onclick="closeNav()" href="javascript:void(0)">&times;</a>
            </div>
            <!-- End of right-aligned X container -->
            <a href="logIt.html">Log A Point</a>
            <a href="passport.html">Passport</a>
            <a href="profile.html">Profile</a>
            <a href="locations.html">All Locations</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <!-- End of sidebar -->

        <!-- Start of row and box content-->
        <div class="row no-gutters rowx content">
            <!-- Start of leftside container section -->
            <div class="col-md-6 no-gutters ">
                <!-- Start of leftside section -->
                <div class="leftside">
                    <!-- Start of form container -->
                    <div class="formContainer">
                        <h1 class="title">Contact</h1>
                        <form action="" method="" id="contactForm">
                            <label>Name</label>
                            <input type="text" id="name" placeholder="Enter your Name" name="name" required>
                            <p class="error" id="nameError"></p>
                            
                            <label>Email</label>
                            <input type="text" id="email" placeholder="Enter your Email" name="email" required>
                            
                            <p class="error" id="emailError"></p>
                            <label>Comment</label>
                            <textarea id="commentData" name="comment" placeholder="Write your comment here!" cols="30"
                                rows="5" required></textarea>
                            <p class="error" id="commentError"></p>
                            
                            <div class="btnContainer">
                                <button id="submitBtn" type="submit" class="btnStandard">Submit</button>
                            </div>
                        </form>
                    </div>
                    <!-- End of form container -->
                </div>
                <!-- Start of leftside container section -->
            </div>
            <!-- Start of rightside container section -->
            <div class="col-md-6 rightside no-gutters ">
                <!-- Start of rightside section -->
                <div class="rightside">
                    <img class="mainImg" src="Images/About/mainImg.png" alt="Image Of Cliffs">
                </div>
                <!-- End of rightside section -->
            </div>
        </div>
        <!-- End of box content-->
    </div>
    <!-- End of box-->

    <!-- Core firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-app.js"></script>
    <!-- Firebase Auth SDK -->
    <script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-auth.js"></script>
    <!-- Navbar.js -->
    <script src="Scripts/navbar.js"></script>
    <!-- Contact.js -->
    <script src="Scripts/contact.js"></script>
</body>

</html>
