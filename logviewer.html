<!DOCTYPE html>
<html id="html">

<head>
	<meta charset="UTF-8">
	<title>Log Viewer</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
		integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
	<!-- Font awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<!-- Simple Lightbox -->
	<link rel="stylesheet" href="Libraries/lightBox/simple-lightbox.min.css">
	<!-- Default.css -->
	<link rel="stylesheet" type="text/css" href="Styles/default.css" />
	<!-- Logviewer.css -->
	<link rel="stylesheet" type="text/css" href="Styles/logviewer.css" />
	<!-- Navbar.css -->
	<link rel="stylesheet" type="text/css" href="Styles/navbar.css" />

	<link rel="shortcut icon" href="Images/Logo/Favicon/favicon.ico" />
</head>

<body>

	<!-- Start of box-->
	<div class="box">

		<!-- Start of navbar and box header-->
		<nav class="topnav rowx header" id="myTopnav">
			<!-- Start of leftnav -->
			<div class="leftNav">
				<img id="logo" class="logo svgIcon" src="Images/Logo/anseoDigitalPassportLogo.svg" alt="Logo">
			</div>
			<!-- End of leftnav -->
			<!-- Start of rightnav -->
			<div class="rightNav">
				<a href="logIt.html">Log A Point</a>
				<a href="passport.html">Passport</a>
				<a href="profile.html">Profile</a>
				<a href="locations.html">All Locations</a>
				<a href="about.html">About</a>
				<a href="contact.html">Contact</a>
				<a href="javascript:void(0);" id="icon" class="icon" onclick="openNav()">
					<i class="fa fa-bars hamburger fa-4x svgIcon"></i>
				</a>
			</div>
			<!-- End of rightnav -->
		</nav>
		<!-- End of navbar and box header-->
		<!-- Start of sidebar -->
		<div id="mySidenav" class="sidenav">
			<!-- Start of right-aligned X container -->
			<div class="mobileRightNav">
				<a class="closebtn" onclick="closeNav()" href="javascript:void(0)">&times;</a>
			</div>
			<!-- End of right-aligned X container -->
			<a href="logIt.html">Log A Point</a>
			<a href="passport.html">Passport</a>
			<a href="profile.html">Profile</a>
			<a href="locations.html">All Locations</a>
			<a href="about.html">About</a>
			<a href="contact.html">Contact</a>
		</div>
		<!-- End of sidebar -->

		<h1 class="title" id="title"> </h1>

		<!-- Start of row and box content-->
		<div class="row no-gutters rowx content">
			<!-- Start of leftside container section -->
			<div class="col-md-6 no-gutters ">
				<!-- Start of leftside section -->
				<div class="leftside ">
					<h3 class="subtitle">Write A Comment</h3>
					<textarea maxlength="255" class="commentInput" id="Comment">Loading...</textarea>
					<button type="button" id="commentBtn" class="btnStandard submit">
						<p class="btnText">Submit Comment!</p>
					</button>
				</div>
				<!-- End of leftside section -->
			</div>
			<!-- End of leftside container section -->
			<br>
			<!-- Start of rightside container section -->
			<div class="col-md-6 no-gutters ">
				<!-- Start of rightside section -->
				<div class="rightside ">
					<h3 class="subtitle">Upload A Photo</h3>
					<div class="polaroid">
						<a id="lightboxPhoto" href="loading.gif">
							<img id="photo" src="Images/Logviewer/loading.gif" alt="Loading"></a>
						<p id="imgSubtitle"></p>
					</div>
					<input class="inputBtn" type="file" title=" " id="fileBtn" value="upload" accept="image/*" />
					<label for="fileBtn" class="btnStandard  submit">
						<p class="btnText">Upload an Image</p>
					</label>
				</div>
				<!-- End of rightside section -->
			</div>
			<!-- End of rightside container section -->
		</div>
		<!-- End of box content-->
		
	</div>
	<!-- End of box-->

	<!-- Core firebase SDK -->
	<script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-app.js"></script>
	<!-- Firebase Auth SDK -->
	<script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-auth.js"></script>
	<!-- Firebase Storage SDK -->
	<script src="https://www.gstatic.com/firebasejs/7.15.0/firebase-storage.js"></script>
	<!-- Jquery -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<!-- SweetAlert-->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@8"></script>
	<!-- Lightbox.js-->
	<script src="Libraries/lightBox/simple-lightbox.min.js"></script>	
	<!-- Navbar.js -->
	<script src="Scripts/navbar.js"></script>
	<!-- Logviewer.js-->
	<script src="Scripts/logviewer.js"></script>
</body>

</html>
