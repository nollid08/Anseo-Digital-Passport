<!DOCTYPE html>
<html lang="en">

    <!-- Navbar.css -->

	<link rel="shortcut icon" href="Images/Logo/Favicon/favicon.ico" />

	<div class="box">

			<div class="leftNav">
				<img id="logo" class="logo" src="Images/Logo/anseoDigitalPassportLogo.svg" alt="Logo">

			<!-- Start of rightnav -->

			</div>
			<!-- End of rightnav -->
		</nav>

			<div class="mobileRightNav">
				<a class="closebtn" onclick="closeNav()" href="javascript:void(0)">&times;</a>
			</div>
			<!-- End of right-aligned X container -->
			<a href="logIt.html">Log A Point</a>

			<div class="col-md-6 no-gutters ">

				<div class="leftside">
					<img id="profilePic" src="Images/Profile/profile.png" alt="Profile Image" class="profilePic">
				</div>
				<!-- End of leftside section -->
			</div>
			<!-- End of leftside container section -->

			<!-- Start of rightside container section -->
			<div class="col-md-6 no-gutters">
				<!-- Start of rightside section -->
				<div class="rightside ">
					<!-- Start of text container section -->
					<div class="textContainer">
						<h1 class="titleClean" id="name">Name: Loading</h1>
						<h1 class="titleClean" id="email">Email: Loading</h1>
						<h1 class="titleClean" id="logs">Logs: Loading</h1>
					</div>
					<!-- End of text container section -->

					<!-- Start of btn container section -->
					<div class="btnContainer">
						<btn class="btnStandard" id="allLogsBtn">
							<p class="btnText">View Logs</p>
						</btn>
						<btn class="btnStandard warning" id="logOutBtn">
							<p class="btnText">Log Out</p>
						</btn>
					</div>
					<!-- End of btn container section -->
				</div>

			</div>
